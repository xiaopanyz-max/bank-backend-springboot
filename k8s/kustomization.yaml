apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - config/app-config.yaml
  - infra/mysql-external.yaml
  - infra/nacos.yaml
  - infra/rocketmq.yaml
  - apps/customer-service.yaml
  - apps/account-service.yaml
  - apps/api-gateway.yaml

# These tags are changed only by the CI deployment job.  A fixed tag makes a
# Git change visible to Argo CD and gives every deployed version a traceable ID.
images:
  - name: ghcr.io/xiaopanyz-max/bank-customer-service
    newTag: sha-9b0efc5366e284b3cc3558f93088d41db7a9d251
  - name: ghcr.io/xiaopanyz-max/bank-account-service
    newTag: sha-9b0efc5366e284b3cc3558f93088d41db7a9d251
  - name: ghcr.io/xiaopanyz-max/bank-api-gateway
    newTag: sha-9b0efc5366e284b3cc3558f93088d41db7a9d251
