name: CI and publish images

on:
  push:
    branches: [main]
    # A release is created by pushing an annotated Git tag such as v1.0.0.
    tags: ["v*"]
    # The deployment job commits only this file. Argo CD handles that commit,
    # so it must not trigger another image build loop.
    paths-ignore:
      - k8s/kustomization.yaml
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: customer-service
            directory: .
          - service: account-service
            directory: account-service
          - service: api-gateway
            directory: api-gateway
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run Maven verification
        working-directory: ${{ matrix.directory }}
        run: mvn --batch-mode verify

  publish-images:
    name: Build and publish ${{ matrix.service }} image
    needs: test
    # Pull requests only validate code. A successful main push publishes deployable images.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: customer-service
            context: .
            dockerfile: Dockerfile
            image: bank-customer-service
          - service: account-service
            context: account-service
            dockerfile: account-service/Dockerfile
            image: bank-account-service
          - service: api-gateway
            context: api-gateway
            dockerfile: api-gateway/Dockerfile
            image: bank-api-gateway
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:sha-${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.ref == 'refs/heads/main' && 'latest' || github.ref_name }}

  update-deployment-manifest:
    name: Update GitOps image versions
    needs: [test, publish-images]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set immutable image tags in Kustomize
        env:
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          sed -i -E "s#(newTag: )sha-[a-f0-9]+#\\1${IMAGE_TAG}#" k8s/kustomization.yaml
          grep -F "newTag: ${IMAGE_TAG}" k8s/kustomization.yaml
      - name: Commit deployment version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/kustomization.yaml
          if git diff --cached --quiet; then
            echo "Deployment manifest is already current."
            exit 0
          fi
          git commit -m "chore(cd): deploy ${GITHUB_SHA} [skip ci]"
          git push
