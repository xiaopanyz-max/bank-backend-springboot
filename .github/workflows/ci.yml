name: CI and publish images

on:
  push:
    branches: [main]
    # A release is created by pushing an annotated Git tag such as v1.0.0.
    tags: ["v*"]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional semantic version to publish, for example v1.0.0"
        required: false
        type: string

permissions:
  contents: read

jobs:
  test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: customer-service
            directory: .
          - service: account-service
            directory: account-service
          - service: api-gateway
            directory: api-gateway
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install common module
        run: mvn --batch-mode -f bank-common/pom.xml install
      - name: Run Maven verification
        working-directory: ${{ matrix.directory }}
        run: mvn --batch-mode verify

  publish-images:
    name: Build and publish ${{ matrix.service }} image
    needs: test
    # Pull requests only validate code. A successful main push publishes deployable images.
    # Manual runs are for semantic releases, so a release_tag input is required.
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: customer-service
            context: .
            dockerfile: Dockerfile
            image: bank-customer-service
          - service: account-service
            context: .
            dockerfile: account-service/Dockerfile
            image: bank-account-service
          - service: api-gateway
            context: .
            dockerfile: api-gateway/Dockerfile
            image: bank-api-gateway
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:sha-${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ (github.event_name == 'release' && github.event.release.tag_name) || (github.event_name == 'workflow_dispatch' && inputs.release_tag) || (github.ref == 'refs/heads/main' && 'latest') || github.ref_name }}

  update-deployment-manifest:
    name: Update GitOps image versions
    needs: [test, publish-images]
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) || github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate GitOps repository token
        env:
          GITOPS_REPO_TOKEN: ${{ secrets.GITOPS_REPO_TOKEN }}
        run: |
          if [ -z "${GITOPS_REPO_TOKEN}" ]; then
            echo "::error::Missing GITOPS_REPO_TOKEN. Create a GitHub token with contents:write access to xiaopanyz-max/bank-backend-gitops and add it as an Actions secret in this repository."
            exit 1
          fi
      - name: Check out GitOps repository
        uses: actions/checkout@v6
        with:
          repository: xiaopanyz-max/bank-backend-gitops
          token: ${{ secrets.GITOPS_REPO_TOKEN }}
          ref: main
          path: gitops
      - name: Set deployment image tags in Kustomize
        working-directory: gitops
        env:
          IMAGE_TAG: ${{ (github.event_name == 'release' && github.event.release.tag_name) || (github.event_name == 'workflow_dispatch' && inputs.release_tag) || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.ref_name) || format('sha-{0}', github.sha) }}
        run: |
          files=$(find k8s -name kustomization.yaml -print)
          for file in ${files}; do
            if grep -q "newTag:" "${file}"; then
              sed -i -E "s#(newTag: ).*#\\1${IMAGE_TAG}#" "${file}"
              grep -F "newTag: ${IMAGE_TAG}" "${file}"
            fi
          done
      - name: Commit deployment version
        working-directory: gitops
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s
          if git diff --cached --quiet; then
            echo "Deployment manifest is already current."
            exit 0
          fi
          git commit -m "chore(cd): deploy ${IMAGE_TAG} [skip ci]"
          git push
