name: CI and publish images

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: customer-service
            directory: .
          - service: account-service
            directory: account-service
          - service: api-gateway
            directory: api-gateway
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run Maven verification
        working-directory: ${{ matrix.directory }}
        run: mvn --batch-mode verify

  publish-images:
    name: Build and publish ${{ matrix.service }} image
    needs: test
    # Pull requests only validate code. A successful main push publishes deployable images.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: customer-service
            context: .
            dockerfile: Dockerfile
            image: bank-customer-service
          - service: account-service
            context: account-service
            dockerfile: account-service/Dockerfile
            image: bank-account-service
          - service: api-gateway
            context: api-gateway
            dockerfile: api-gateway/Dockerfile
            image: bank-api-gateway
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:sha-${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
